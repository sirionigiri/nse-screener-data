name: Update Nifty TRI Data

on:
  schedule:
    # 5:30 AM IST = 00:00 UTC  |  runs every day
    - cron: "0 0 * * *"
  workflow_dispatch:          # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # ~100 indices × 1-3 s sleep + retries

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: pip install requests pandas openpyxl pyarrow urllib3

      # ── 4. Scrape & merge ────────────────────────────────────
      - name: Run incremental TRI update
        run: python update_nifty_data.py
        env:
          PYTHONUNBUFFERED: "1"

      # ── 5. Commit & push ─────────────────────────────────────
      - name: Commit updated parquet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/nifty_data.parquet nifty_data.parquet

          if git diff --cached --quiet; then
            echo "No new data — nothing to commit."
          else
            TODAY=$(date -u '+%Y-%m-%d')
            git commit -m "chore: TRI data update ${TODAY} [skip ci]"
            git push
          fi