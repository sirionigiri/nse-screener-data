name: Update International Data

on:
  schedule:
    # 11:45 PM IST = 18:15 UTC — after US markets close, weekdays only
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas pyarrow

      - name: Run incremental update
        run: python update_international_data.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated parquet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/international_data.parquet

          if git diff --cached --quiet; then
            echo "No new data — nothing to commit."
          else
            TODAY=$(date -u '+%Y-%m-%d')
            git commit -m "chore: international data update ${TODAY} [skip ci]"
            git stash
            git pull --rebase origin main
            git stash drop || true
            git push
          fi